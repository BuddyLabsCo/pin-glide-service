  /v1/pairing-sessions/{id}/complete:
    post:
      description: "Records one participant's authenticated report that it saved the derived Pairing key and verified its peer's key confirmation. The claiming Sender reports with its management credential; the Receiver side reports with the session's restricted credential. Both reports atomically activate the session's reservation: a new_receiver session then becomes credential_ready, while an add_sender session completes without issuing a Receiver credential. Repeating a successful side's report is idempotent. Receiver credential recovery reports through its own retained-key reconciliation instead. A re-pairing commits its own Pairing ID and retires only the confirming Sender's association that this session replaced, and only while that association is still current; any other outcome fails with 409 operation_superseded and preserves the association that is current. Failures report 401 for an unusable credential, 404 resource_not_found, 409 pairing_not_ready or operation_superseded, 410 pairing_session_expired or pairing_session_closed, 422 validation_failed, or 503 service_unavailable."
      operationId: PostPairingSessionComplete
      parameters:
        - description: Pairing Session ID
          in: path
          name: id
          required: true
          schema:
            description: Pairing Session ID
            maxLength: 128
            type: string
      requestBody:
