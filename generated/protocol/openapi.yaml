  /v1/pairing-sessions/{id}/receiver-token:
    post:
      description: "Redeems one session's credential grant for the Receiver side and returns the long-lived Receiver credential to that holder only, as a no-store response. The session's one issuance operation orders the request by operationId and attempt: an equal or lower attempt and any competing operation are superseded, while the one higher attempt may replace a credential no one has proved possession of yet, so a lost response costs at most one retransmission. Once the credential proves possession, redemption can no longer rotate it. An add_sender session returns mode_forbids_credential_issue without touching credentials. The credential is stored as a digest only and never reaches the Sender, the QR or a session view. Redeeming a recover_receiver session replaces the credential of that shared Receiver for every Sender: it supersedes the grants of older sessions for the same Receiver, revokes the credential it replaces and ends that generation's reserved and active delivery connections before the replacement is handed out, so a delayed older issuance, an old redemption or a handshake already committing cannot revive the superseded access. Failures report 401 for an unusable restricted credential, 409 operation_superseded, pairing_not_ready or mode_forbids_credential_issue, 410 pairing_session_closed, 422 validation_failed, or 503 service_unavailable."
      operationId: PostPairingSessionReceiverToken
      parameters:
        - description: Pairing Session ID
          in: path
          name: id
          required: true
          schema:
            description: Pairing Session ID
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedReceiverToken"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Redeem the Pairing Session's Receiver credential
      tags:
        - pairing
  /v1/self/pairings/{id}:
    delete:
      description: Removes this Sender's own authorization to forward to a Receiver and answers 204. The Receiver credential, its delivery connection and every other Sender's association survive, and the removed association keeps its durable identity. The Sender's unfinished association work for the same Receiver is canceled with it, so a later key-confirmation report cannot recreate the association those clients removed; a connected Receiver is told with pairing_removed on its delivery connection, which stays open. A Pairing that is unknown, owned by another Sender, still pending or already removed reports 404 resource_not_found exactly as one that does not exist. Failures report 401 for an absent or unusable management credential, 404 resource_not_found, or 503 service_unavailable.
      operationId: DeleteSelfPairing
      parameters:
        - description: Pairing ID of the Sender's own association
          in: path
          name: id
          required: true
          schema:
            description: Pairing ID of the Sender's own association
            maxLength: 128
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Remove the Sender's own association
      tags:
        - pairing
    patch:
      description: Replaces the authenticated Sender's own alias for one of its active associations and returns that association as it now is, with the Receiver's current presence. An empty alias clears the Sender's own label. The Pairing identity, its Receiver, the Receiver's delivery connection and every other Sender's association are untouched. A Pairing that is unknown, owned by another Sender, still pending or already removed reports 404 resource_not_found exactly as one that does not exist, so no caller can confirm another Sender's association. Failures report 401 for an absent or unusable management credential, 404 resource_not_found, 422 validation_failed for a body without an alias within its length, or 503 service_unavailable.
      operationId: PatchSelfPairing
      parameters:
        - description: Pairing ID of the Sender's own association
          in: path
          name: id
          required: true
          schema:
            description: Pairing ID of the Sender's own association
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingAlias"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverAssociation"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Rename the Sender's own association alias
      tags:
        - pairing
  /v1/self/receivers:
    get:
      description: "Returns every active association the authenticated Sender owns: the Receiver it forwards to, the Pairing ID both clients stored the Pairing key under, the Sender's own alias, and the Receiver's current presence with the time that state last changed. Only this Sender's own associations appear: another Sender sharing the same Receiver is invisible here, and a pending reservation appears only as its Pairing Session. Management authority is required, so an upload, Receiver or restricted pairing credential authorizes nothing here. Failures report 401 for an absent or unusable management credential, or 503 service_unavailable."
      operationId: GetSelfReceivers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: List the Sender's own Receiver associations
      tags:
        - pairing
servers:
  - description: The public origin supplied by the installation.
    url: https://{serviceHost}
    variables:
      serviceHost:
        default: localhost:8080
        description: Host and port of the public HTTPS origin.
