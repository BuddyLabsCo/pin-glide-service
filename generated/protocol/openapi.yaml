# Generated from the service's Huma registrations; do not edit.
components:
  schemas:
    ErrorItem:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[0]'
          type: string
        message:
          description: Why the input was rejected
          type: string
      required:
        - message
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        status:
          description: ok when the service and its database are available
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          examples:
            - invalid_request
          type: string
        detail:
          description: Safe explanation of this occurrence; clients must not parse it for control flow
          type: string
        errors:
          description: Validation failures as location and message only
          items:
            $ref: "#/components/schemas/ErrorItem"
          type:
            - array
            - "null"
        requestId:
          description: Service-generated operation identifier for log correlation
          type: string
        status:
          description: HTTP status code; matches the response status
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: Stable English summary of the problem type
          examples:
            - Invalid request
          type: string
        type:
          description: Problem type identifier; always /problems/{code}
          examples:
            - /problems/invalid_request
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
      type: object
info:
  description: The Pin Glide service HTTP surface. Whole-request failures carry an RFC 9457 problem detail with a stable machine-readable code; credentials belong in the Authorization header, never in a URL.
  title: Pin Glide Service API
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Reports ok while the service and its database are available, and a sanitized 503 otherwise.
      operationId: GetHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security: []
      summary: Report sanitized service health
      tags:
        - system
servers:
  - description: The public origin supplied by the installation.
    url: https://{serviceHost}
    variables:
      serviceHost:
        default: localhost:8080
        description: Host and port of the public HTTPS origin.
