  /v1/self/receivers:
    get:
      description: "Returns every active association the authenticated Sender owns: the Receiver it forwards to, the Pairing ID both clients stored the Pairing key under, the Sender's own alias, and the Receiver's current presence with the time that state last changed. Only this Sender's own associations appear: another Sender sharing the same Receiver is invisible here, and a pending reservation appears only as its Pairing Session. Management authority is required, so an upload, Receiver or restricted pairing credential authorizes nothing here. Failures report 401 for an absent or unusable management credential, or 503 service_unavailable."
