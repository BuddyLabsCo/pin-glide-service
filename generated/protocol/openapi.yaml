  /v1/messages:
    post:
      description: "Admits one Sender's Message and forwards each entry to the Receiver it selected, answering 207 with one terminal result per input entry and its original index. Upload authority is required, so an absent credential reports 401 credential_missing; an unknown or wrongly scoped credential, and one an earlier logout, fresh login or family-reuse revocation invalidated, reports 401 credential_invalid; an expired one reports 401 credential_expired; and one whose Sender registration an owner permanently closed reports 401 credential_revoked. The Sender identity comes from that credential, never from the payload. The envelope is the whole-request contract: a body that is not JSON reports 400 invalid_request, a missing request body reports 400 invalid_request, and a JSON body without a readable messageId or without an items array reports 422 validation_failed. Once entries can be enumerated, each entry is validated on its own index, so a malformed entry never suppresses a valid one. Two entries naming the same Receiver are both rejected with duplicate_receiver, because the service never chooses between different ciphertexts for one Delivery. Each entry is validated and then authorized before its dedup lookup: another readable cryptoVersion reports unsupported_crypto_version; a missing field, unpadded or non-Base64 value, a nonce that is not 96 bits or a ciphertext that cannot hold its 128-bit tag reports invalid_delivery_item; and a Receiver that is unknown to this Sender, not its own active Pairing or revoked reports receiver_not_authorized without confirming whether it exists. An entry whose Receiver holds no current delivery connection reports offline, a write that failed or exceeded its bound reports send_failed, and a Receiver that did not report arrival within the bound after a successful write reports ack_timeout; arrival is not guaranteed absent in either of those two. The retained identity is (Sender, messageId, Receiver): the winning claim sends once while a concurrent duplicate of the same identity joins that live work or reads its retained terminal result without sending again, and later submissions validate their own authority before that lookup and never rewrite an earlier Delivery history. An identity a caller re-submits after a restart, or one whose registered work this process lost, reports interrupted rather than resending ciphertext. A caller that disconnects or times out does not cancel the work it registered, which keeps running to its own terminal outcome inside the same batch budget, and a bounded service shutdown ends that work as interrupted instead of writing ciphertext after the process stopped accepting it. A Receipt means arrival only: it is reported once the receiver's minimal correlation is readable, before the Receiver validates, decrypts or displays anything. Late or duplicated Receipts never change a terminal result. The service validates the accepted encryption profile without decrypting content, keeps ciphertext only in memory for the attempt, and never stores or logs a ciphertext, a key or a plaintext. It performs no retry, no offline queue and no history replay. A 207 result carrying offline or rejected means this invocation did not forward that entry, and does not disprove an earlier Delivery of the same Message, while interrupted, send_failed and ack_timeout may follow an arrival. When a reliable terminal result cannot be obtained, the whole request reports 503 delivery_status_unavailable instead of a pending success, because delivery may already have occurred. The 207 response uses application/json and carries requestId once at the top level."
      operationId: PostMessages
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "207":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: Multi-Status
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Upload indexed ciphertexts for live Delivery
      tags:
        - delivery
