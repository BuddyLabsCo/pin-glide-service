# Generated from the service's Huma registrations; do not edit.
components:
  schemas:
    AuthorizeRequest:
      additionalProperties: false
      properties:
        alias:
          description: Replacement for the claiming Sender's own alias; omit it to preserve the current alias
          maxLength: 256
          type: string
        wechatCode:
          description: Fresh WeChat authorization; required for recover_receiver
          maxLength: 512
          type: string
      type: object
    CompleteRequest:
      additionalProperties: false
      properties:
        keyConfirmation:
          description: Authenticated confirmation that this side saved the Pairing key and verified its peer's key confirmation
          enum:
            - confirmed
          type: string
      required:
        - keyConfirmation
      type: object
    CreateRequest:
      additionalProperties: false
      properties:
        mode:
          description: "Fixed session mode: new_receiver allocates a Receiver, add_sender attaches one more Sender to an existing Receiver, recover_receiver replaces a lost Receiver credential"
          enum:
            - new_receiver
            - add_sender
            - recover_receiver
          type: string
        receiverId:
          description: Existing Receiver for add_sender and recover_receiver; omit it for new_receiver
          maxLength: 128
          type: string
      required:
        - mode
      type: object
    CreatedSession:
      additionalProperties: false
      properties:
        pairingToken:
          description: Restricted five-minute Pairing credential; opens the pairing channel for this session and redeems its first Receiver credential
          type: string
        pairingTokenExpiresAt:
          description: Absolute expiry of the restricted credential; the session cannot outlive it
          format: date-time
          type: string
        session:
          $ref: "#/components/schemas/PairingSessionView"
          description: The created Pairing Session
      required:
        - session
        - pairingToken
        - pairingTokenExpiresAt
      type: object
    CredentialBundle:
      additionalProperties: false
      properties:
        accountId:
          description: Internal Account identifier that owns this Sender
          type: string
        refresh:
          $ref: "#/components/schemas/IssuedCredential"
          description: Renewal credential with a sliding seven-day lifetime
        senderId:
          description: Sender registration ID (deviceId); save it to restore this installation
          type: string
        uploader:
          $ref: "#/components/schemas/IssuedCredential"
          description: Upload and model-credential access, valid for three hours
        userSession:
          $ref: "#/components/schemas/IssuedCredential"
          description: Management credential, valid for three hours
      required:
        - accountId
        - senderId
        - userSession
        - uploader
        - refresh
      type: object
    ErrorItem:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[0]'
          type: string
        message:
          description: Why the input was rejected
          type: string
      required:
        - message
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        status:
          description: ok when the service and its database are available
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    IssuedCredential:
      additionalProperties: false
      properties:
        expiresAt:
          description: Actual expiry of this credential in RFC 3339 UTC
          format: date-time
          type: string
        token:
          description: Raw opaque credential; send it only in the Authorization header of an authenticated HTTPS or WSS request
          type: string
      required:
        - token
        - expiresAt
      type: object
    IssuedReceiverToken:
      additionalProperties: false
      properties:
        receiverId:
          description: Receiver the credential belongs to
          type: string
        receiverToken:
          description: Long-lived Receiver credential; store it securely, it is never returned again
          type: string
      required:
        - receiverId
        - receiverToken
      type: object
    LogoutRequest:
      additionalProperties: false
      properties:
        mode:
          default: logout
          description: logout revokes this Sender's credentials and preserves its Pairings; switch_account also removes its own Pairings and requires its management credential in the Authorization header
          enum:
            - logout
            - switch_account
          type: string
        refreshToken:
          description: Renewal credential F; present exactly when the request carries no Authorization credential. switch_account always requires a management credential in the header instead
          maxLength: 512
          minLength: 1
          type: string
      type: object
    PairingAlias:
      additionalProperties: false
      properties:
        alias:
          description: Replacement alias for the Sender's own association; an empty value clears it
          maxLength: 256
          type: string
      required:
        - alias
      type: object
    PairingSessionView:
      additionalProperties: false
      properties:
        expiresAt:
          description: Absolute end of the session and of its restricted credential
          format: date-time
          type: string
        mode:
          description: "Fixed session mode: new_receiver, add_sender or recover_receiver"
          enum:
            - new_receiver
            - add_sender
            - recover_receiver
          type: string
        pairingId:
          description: Reserved Pairing ID; absent for recovery sessions and unclaimed new sessions
          type: string
        receiverConfirmed:
          description: Whether the Receiver side reported key confirmation
          type: boolean
        receiverId:
          description: Receiver-side target fixed at creation
          type: string
        senderConfirmed:
          description: Whether the Sender side reported key confirmation
          type: boolean
        senderId:
          description: Claiming Sender; absent until a claim succeeds
          type: string
        sessionId:
          description: Opaque session identifier the QR references
          type: string
        state:
          description: Session state; expiry is reported as expired
          enum:
            - awaiting_authorization
            - awaiting_confirmation
            - credential_ready
            - credential_issued
            - completed
            - canceled
            - expired
            - superseded
          type: string
      required:
        - sessionId
        - mode
        - receiverId
        - state
        - expiresAt
        - senderConfirmed
        - receiverConfirmed
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          examples:
            - invalid_request
          type: string
        detail:
          description: Safe explanation of this occurrence; clients must not parse it for control flow
          type: string
        errors:
          description: Validation failures as location and message only
          items:
            $ref: "#/components/schemas/ErrorItem"
          type:
            - array
            - "null"
        requestId:
          description: Service-generated operation identifier for log correlation
          type: string
        status:
          description: HTTP status code; matches the response status
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: Stable English summary of the problem type
          examples:
            - Invalid request
          type: string
        type:
          description: Problem type identifier; always /problems/{code}
          examples:
            - /problems/invalid_request
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
      type: object
    ReceiverAssociation:
      additionalProperties: false
      properties:
        alias:
          description: The owning Sender's own label for this association; empty when unset
          type: string
        pairingId:
          description: Pairing ID both clients stored the Pairing key under
          type: string
        presence:
          description: Whether this Receiver currently holds its committed delivery connection
          enum:
            - online
            - offline
          type: string
        receiverId:
          description: Receiver this association forwards to
          type: string
        stateChangedAt:
          description: When the Receiver's published presence last changed, in RFC 3339 UTC
          format: date-time
          type: string
      required:
        - receiverId
        - pairingId
        - alias
        - presence
        - stateChangedAt
      type: object
    ReceiverList:
      additionalProperties: false
      properties:
        items:
          description: The Sender's own active associations; empty when it has none
          items:
            $ref: "#/components/schemas/ReceiverAssociation"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    RedeemRequest:
      additionalProperties: false
      properties:
        attempt:
          description: 0 is the original request, 1 the one permitted retransmission of it
          format: int64
          maximum: 1
          minimum: 0
          type: integer
        operationId:
          description: Credential-issuance operation identifier the client persisted before sending
          maxLength: 128
          minLength: 1
          type: string
      required:
        - operationId
        - attempt
      type: object
    RefreshBundle:
      additionalProperties: false
      properties:
        accountId:
          description: Internal Account identifier that owns this Sender
          type: string
        attempt:
          description: Attempt number this renewal committed
          format: int64
          type: integer
        operationId:
          description: Operation identifier this renewal committed
          type: string
        refresh:
          $ref: "#/components/schemas/IssuedCredential"
          description: Renewal credential with a sliding seven-day lifetime
        senderId:
          description: Sender registration ID (deviceId); save it to restore this installation
          type: string
        uploader:
          $ref: "#/components/schemas/IssuedCredential"
          description: Upload and model-credential access, valid for three hours
        userSession:
          $ref: "#/components/schemas/IssuedCredential"
          description: Management credential, valid for three hours
      required:
        - operationId
        - attempt
        - accountId
        - senderId
        - userSession
        - uploader
        - refresh
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        attempt:
          description: 0 for the original request, 1 for its one permitted retransmission
          format: int64
          maximum: 1
          minimum: 0
          type: integer
        operationId:
          description: Client-generated identifier of one renewal operation, reused by that operation's retransmission
          maxLength: 128
          minLength: 1
          type: string
        refreshToken:
          description: Current renewal credential F; the client persists its operation state before sending it, and it never travels in a URL
          maxLength: 512
          minLength: 1
          type: string
      required:
        - refreshToken
        - operationId
        - attempt
      type: object
    WeChatLoginRequest:
      additionalProperties: false
      properties:
        senderId:
          description: Saved Sender ID to restore; omit it to register this installation as a new Sender
          maxLength: 128
          type: string
        wechatCode:
          description: Fresh single-use WeChat authorization code obtained by the Android client
          maxLength: 512
          minLength: 1
          type: string
      required:
        - wechatCode
      type: object
    WeChatProofRequest:
      additionalProperties: false
      properties:
        wechatCode:
          description: Fresh single-use WeChat authorization code obtained by the Account owner
          maxLength: 512
          minLength: 1
          type: string
      required:
        - wechatCode
      type: object
  securitySchemes:
    bearerAuth:
      description: One service credential in the Authorization header. The operation states which credential it accepts.
      scheme: bearer
      type: http
info:
  description: The Pin Glide service HTTP surface. Whole-request failures carry an RFC 9457 problem detail with a stable machine-readable code; credentials belong in the Authorization header, never in a URL.
  title: Pin Glide Service API
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Reports ok while the service and its database are available, and a sanitized 503 otherwise.
      operationId: GetHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security: []
      summary: Report sanitized service health
      tags:
        - system
  /v1/auth/logout:
    post:
      description: "Revokes the current Sender's credential family, which is both access scopes and the renewal credential, without permanently closing its Device Registration; other installations and a family a fresh login replaced keep working. The default logout mode preserves the Sender's Pairings, and switch_account additionally removes only that Sender's own associations and cancels its unfinished Pairing work in the same commit, because the next Account must not inherit them. Switching removes associations, so only the management credential may request it, and the client clears its local identity and pairing keys itself before requesting a new registration. The Sender's own authority for this operation is exactly one source: its management or upload credential in the Authorization header, or its renewal credential in the refreshToken body field. Renewing access first is never required, so a renewal credential authorizes logout while the access credentials have expired. An ordinary logout request offering both sources is rejected as 422 validation_failed, as was one without a usable source: an absent credential reports 401 credential_missing, an unknown or wrongly scoped one 401 credential_invalid, an expired one 401 credential_expired, and a credential an earlier logout or a fresh login revoked 401 credential_revoked. A switch_account request is decided by the management credential in its Authorization header alone, so a renewal credential in the body adds nothing to it, and one without that header credential reports 401 credential_missing, an unknown or wrongly scoped one 401 credential_invalid, an expired one 401 credential_expired, and one whose registration an owner permanently closed 401 credential_revoked. Ending this Sender's access never reaches back into work already admitted: a live delivery connection and a Delivery the service already accepted keep the authorization they were admitted with until they end, while every new request validates the current credentials again. A request that never reached the service revokes nothing, and the client stops forwarding locally at once without claiming remote sign-out it did not receive. This response carries no credential and is never cacheable."
      operationId: PostAuthLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security: []
      summary: Revoke the Sender's service access
      tags:
        - identity
  /v1/auth/refresh:
    post:
      description: Rotates the Sender's userSession, uploader and refresh credentials through one operation ID and its attempt number. The client persists that operation ID with the current bundle before it sends it, keeps one single-flight renewal at a time, stores a returned bundle atomically in secure storage, and discards a response that belongs to an inactive local login or logout generation. Attempt 0 is the original request and attempt 1 its one permitted retransmission of an uncertain outcome; either can commit first, and the service never replays a lost response. A recorded attempt equal to or higher than the submitted one reports 409 operation_superseded without issuing or revoking anything. A higher attempt of the recorded operation recovers one lost response only while the consumed token is that operation's recorded predecessor, inside a 30-second overlap and before that token's original expiry, and receives a freshly minted bundle. A higher attempt that presents a credential no operation has consumed is not that operation's retransmission and reports 409 operation_mismatch without issuing or revoking anything. Any other use of a consumed token reports 401 refresh_reuse_detected and revokes only that Sender's family, so unknown or expired tokens never revoke anything. Existing userSession and uploader tokens keep their original expiry during ordinary rotation. Raw credentials appear only in this response, which is never cacheable.
      operationId: PostAuthRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshBundle"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security: []
      summary: Rotate the Sender credential bundle
      tags:
        - identity
  /v1/auth/wechat:
    post:
      description: Verifies a fresh WeChat authorization code, maps it to its Account and creates or restores this installation's Sender registration, replacing that Sender's previous credential family. Omitting senderId registers a new Sender; supplying one restores only an owned active registration. Failures report 401 wechat_authorization_invalid, 404 resource_not_found for an unknown or foreign senderId, 409 device_registration_revoked for a permanently revoked one, 502 identity_provider_error or 503 service_unavailable. Raw M, U and F credentials are returned only to this holder and the response is never cacheable.
      operationId: PostAuthWechat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeChatLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBundle"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Gateway
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security: []
      summary: Verify WeChat login and issue Sender credentials
      tags:
        - identity
  /v1/devices/{id}/revoke:
    post:
      description: "Permanently closes one Sender registration that belongs to the Account the fresh WeChat proof verifies: every credential of that Sender is invalidated, its unfinished authorized Pairing work is canceled and only its own associations are removed, in one commit. The Receiver's credential, its delivery connection and every other Sender's association survive, including with a Receiver the revoked Sender shared, and a later login presenting the closed registration ID is refused with 409 device_registration_revoked for as long as the registration is retained. Revoking a registration never reaches back into work already admitted: a live delivery connection and a Delivery the service already accepted keep the authorization they were admitted with until they end, while every new request validates the current credentials again. Ordinary logout and refresh-family reuse revocation never close a registration, so this is the only permanent outcome. The caller's own management credential authorizes the request, so only the Account that owns the registration can revoke it. Failures report 401 credential_missing for an absent management credential, 401 credential_invalid for an unknown or wrongly scoped one, 401 credential_expired for an expired one, 401 credential_revoked for one whose own registration an owner permanently closed, 401 wechat_authorization_invalid for proof the provider refuses, 403 fresh_identity_required for proof of another Account, 404 resource_not_found for an unknown or foreign registration, 409 device_registration_revoked for an owned registration that is already permanently closed, 422 validation_failed for a body carrying no usable fresh proof, 502 identity_provider_error, or 503 service_unavailable. This response carries no credential and is never cacheable."
      operationId: PostDeviceRevoke
      parameters:
        - description: Sender registration ID (deviceId) to revoke permanently
          in: path
          name: id
          required: true
          schema:
            description: Sender registration ID (deviceId) to revoke permanently
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeChatProofRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Gateway
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Permanently revoke one owned Sender registration
      tags:
        - identity
  /v1/pairing-sessions:
    post:
      description: Creates one mode-fixed session that lives five minutes and hands its restricted credential only to the Receiver-side peer. new_receiver allocates a Receiver. add_sender attaches one more Sender to the Receiver named by receiverId and authenticates with that Receiver's own current credential in the Authorization header; presenting it proves possession and consumes any issuance grant still outstanding, and it authorizes no other Receiver. recover_receiver acts on an existing Receiver and takes no credential at creation. The Sender that approves the session supplies its own authority when it claims the session. Failures report 401 credential_missing or credential_invalid for add_sender, 404 resource_not_found for a Receiver the credential does not authenticate, 422 validation_failed for a mode and target that do not match, or 503 service_unavailable.
      operationId: PostPairingSessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSession"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - {}
        - bearerAuth: []
      summary: Create a restricted Pairing Session
      tags:
        - pairing
  /v1/pairing-sessions/{id}:
    delete:
      description: "Cancels a session before activation and releases its reservation. Both participants are told the session closed, and the restricted channel stops relaying: its next frame closes the connection. An already activated association is not undone: the call reports 410 pairing_session_closed and ordinary Pairing removal applies. Failures report 401 for an unusable credential, 404 resource_not_found, 410 pairing_session_expired or pairing_session_closed, or 503 service_unavailable."
      operationId: DeletePairingSession
      parameters:
        - description: Pairing Session ID
          in: path
          name: id
          required: true
          schema:
            description: Pairing Session ID
            maxLength: 128
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Cancel an unfinished Pairing Session
      tags:
        - pairing
  /v1/pairing-sessions/{id}/authorize:
    post:
      description: Fixes the claiming Sender for a session and reserves binding capacity for a new distinct Receiver. A repeated claim by the same Sender returns the same session; another Sender receives 409 pairing_session_claimed. recover_receiver additionally requires fresh WeChat owner proof. Failures report 401 for an unusable management credential, 403 fresh_identity_required, 404 resource_not_found, 409 receiver_limit_reached or pairing_session_claimed, 410 pairing_session_expired or pairing_session_closed, or 503 service_unavailable.
      operationId: PostPairingSessionAuthorize
      parameters:
        - description: Pairing Session ID
          in: path
          name: id
          required: true
          schema:
            description: Pairing Session ID
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
        required: true
      responses:
