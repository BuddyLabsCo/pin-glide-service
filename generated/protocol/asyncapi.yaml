          type: string
        side:
          description: Participant the bytes came from; sender or receiver
          type: string
        type:
          description: Message type; pairing_relay
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - sessionId
      - side
      - payload
      type: object
    PairingRemoved:
      additionalProperties: false
      properties:
        pairingId:
          description: Pairing ID of the removed association
          type: string
        senderId:
          description: Sender whose association was removed
          type: string
        type:
          description: Message type; pairing_removed
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
