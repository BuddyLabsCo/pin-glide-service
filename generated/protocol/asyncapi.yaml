asyncapi: 3.1.0
channels:
  pairingSessionEvents:
    address: /v1/pairing-sessions/{id}/events
    description: "One Pairing Session's handshake channel. A participant subscribes with\nthe session's restricted credential, or with the management credential of\nthe Sender that claimed it; the service derives the participant side from\nwhichever credential authenticated. It relays opaque handshake bytes to\nthe other participant, sends the session state after subscription and on\nevery change, and reports failures without closing a usable session.\nRelayed bytes are live traffic: the service keeps no history, so a\nreconnect receives the current state and nothing sent before it.\n\nA subscription the service rejects before upgrading is an ordinary HTTP\nproblem detail: 400 invalid_request when the upgrade did not offer the\npin-glide.v1 subprotocol, 401 credential_missing, credential_invalid or\ncredential_expired, 404 resource_not_found, 410 pairing_session_expired or\npairing_session_closed, or 503 service_unavailable. A credential's own\nvalidity is decided before the protected session state, so an expired\nrestricted credential reports itself while the valid management\ncredential of the session's own Sender reports the expired session.\n\nAfter the upgrade every recoverable failure arrives as an error message\nand the connection stays open. A frame that is not a pairing_relay of this\nversion, an unknown message type and a frame for another session are\nprotocol errors rather than relay traffic, so the service closes with\n1002. Invalid text encoding closes with 1007, a session that may no longer\nrelay closes with 1008, a normal close uses 1000, server shutdown uses\n1001 and an unexpected server failure uses 1011. Close reasons carry a\nshort machine code and never secret data.\n\nOnce both authenticated reports have activated the session's Pairing, the\nchannel no longer relays: a new_receiver session tells only its Receiver\nside that the credential is ready, and a session that completes,\nsupersedes or closes ends its live connections. Redemption of the\ncredential itself is an HTTPS operation, so the restricted credential\nnever travels over this channel twice.\n\nThe Pairing ID a session publishes on its first claim is the identity\nboth participants store their provisional key under, and neither selects\nit for forwarding before the session reports completed. Re-pairing\nreserves a Pairing ID of its own next to the Sender's current\nassociation, which keeps forwarding under its own alias until both\nreports commit the replacement and retire only that association. A\nreplacement whose expected association already changed fails with\noperation_superseded and preserves the association that is current\ninstead."
    messages:
      credentialReady:
        $ref: "#/components/messages/credentialReady"
      error:
        $ref: "#/components/messages/error"
      pairingRelayIn:
        $ref: "#/components/messages/pairingRelayIn"
      pairingRelayOut:
        $ref: "#/components/messages/pairingRelayOut"
      pairingState:
        $ref: "#/components/messages/pairingState"
    parameters:
      id:
        description: Pairing Session identifier the QR references.
    title: Restricted Pairing Session channel
    x-close-codes:
    - code: 1000
      description: The connection ended normally.
      reason: ""
    - code: 1001
      description: The service is shutting down.
      reason: service_shutdown
    - code: 1002
      description: The connection sent a frame that is not an accepted message of this protocol version, type or shape.
      reason: protocol_error
    - code: 1007
      description: The connection sent text that is not valid UTF-8.
      reason: invalid_payload
    - code: 1008
      description: The connection's credential, session or policy no longer authorizes it.
      reason: policy_violation
    - code: 1011
      description: An unexpected server failure ended the connection.
      reason: internal_error
  receiverEvents:
    address: /v1/receiver/events
    description: "The single long-lived delivery channel of one Receiver, authenticated by\nits Receiver credential on the upgrade request. An upgrade must offer the\npin-glide.v1 subprotocol, and one that does not is rejected before the\nupgrade with HTTP 400 invalid_request. One Receiver generation has one\nreserved or active slot: a second handshake with the same credential is\nrejected before the upgrade with HTTP 409 receiver_already_connected and\nnever evicts the connection that already holds the slot. A rejected\nhandshake leaves that connection's presence unchanged.\n\nThis connection is the Receiver's liveness. Online begins with the\ncommitted upgrade, and the owning Sender's Receiver list reports the\nReceiver offline on the end of that connection, on a heartbeat failure or\non a service restart. The service sends a Ping every 15 seconds and\nrequires the Pong within 5 seconds, then closes and releases a connection\nthat stopped answering, so a half-open transport cannot hold the slot. A\nreconnect is a new live connection and receives nothing kept for the\nprevious one.\n\nA successful upgrade commits credential possession: the session whose\ngrant the credential came from completes and its restricted pairing\nchannel closes. Delivery and Receipt messages arrive on this channel with\nlive delivery; until they are published, an application frame is a\nprotocol error and closes with 1002. Invalid text encoding closes with\n1007, a normal close uses 1000, server shutdown uses 1001 and an\nunexpected server failure uses 1011."
    title: Receiver delivery channel
    x-close-codes:
    - code: 1000
      description: The connection ended normally.
      reason: ""
    - code: 1001
      description: The service is shutting down.
      reason: service_shutdown
    - code: 1002
      description: The connection sent a frame that is not an accepted message of this protocol version, type or shape.
      reason: protocol_error
    - code: 1007
      description: The connection sent text that is not valid UTF-8.
      reason: invalid_payload
    - code: 1008
      description: The connection's credential, session or policy no longer authorizes it.
      reason: policy_violation
    - code: 1011
      description: An unexpected server failure ended the connection.
      reason: internal_error
components:
  messages:
    credentialReady:
      description: |-
        Sent only to the Receiver side of a new_receiver session once both
        authenticated reports activated its Pairing. It carries no credential:
        the Receiver redeems its first Receiver credential over HTTPS with the
        restricted credential it already holds, and the Sender side never
        learns that the credential exists.
      name: credential_ready
      payload:
        $ref: "#/components/schemas/CredentialReady"
      title: The session's Receiver credential can be redeemed
    error:
      description: |-
        A failure that leaves the session usable, so the connection stays open.
        pairing_not_ready means the session cannot relay this frame yet, for
        example because the other participant is not connected; the client
        retries once its peer is present.
      name: error
      payload:
        $ref: "#/components/schemas/WSSError"
      title: Recoverable application error
    pairingRelayIn:
      name: pairing_relay
      payload:
        $ref: "#/components/schemas/PairingRelayIn"
      title: Opaque handshake frame from a participant
    pairingRelayOut:
      description: The payload is unchanged; the side is derived from authentication.
      name: pairing_relay
      payload:
        $ref: "#/components/schemas/PairingRelayOut"
      title: The peer's opaque handshake frame
    pairingState:
      description: The session state after an authorized subscription and after every change.
      name: pairing_state
      payload:
        $ref: "#/components/schemas/PairingState"
      title: Pairing Session state
  schemas:
    CredentialReady:
      additionalProperties: false
      properties:
        expiresAt:
          description: Absolute end of the restricted credential's redemption window
          format: date-time
          type: string
        receiverId:
          description: Receiver the credential belongs to
          type: string
        sessionId:
          description: Pairing Session whose credential is ready
          type: string
        type:
          description: Message type; credential_ready
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - sessionId
      - receiverId
      - expiresAt
      type: object
    PairingRelayIn:
      additionalProperties: false
      properties:
        payload:
          description: Padded-Base64 opaque handshake bytes
          type: string
        sessionId:
          description: Pairing Session this handshake belongs to
          type: string
        type:
          description: Message type; pairing_relay on this direction
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - sessionId
      - payload
      type: object
    PairingRelayOut:
      additionalProperties: false
      properties:
        payload:
          description: The peer's padded-Base64 handshake bytes, unchanged
          type: string
        sessionId:
          description: Pairing Session this handshake belongs to
          type: string
        side:
          description: Participant the bytes came from; sender or receiver
          type: string
        type:
          description: Message type; pairing_relay
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - sessionId
      - side
      - payload
      type: object
    PairingSessionView:
      additionalProperties: false
      properties:
        expiresAt:
          description: Absolute end of the session and of its restricted credential
          format: date-time
          type: string
        mode:
          description: "Fixed session mode: new_receiver, add_sender or recover_receiver"
          enum:
          - new_receiver
          - add_sender
          - recover_receiver
          type: string
        pairingId:
          description: Reserved Pairing ID; absent for recovery sessions and unclaimed new sessions
          type: string
        receiverConfirmed:
          description: Whether the Receiver side reported key confirmation
          type: boolean
        receiverId:
          description: Receiver-side target fixed at creation
          type: string
        senderConfirmed:
          description: Whether the Sender side reported key confirmation
          type: boolean
        senderId:
          description: Claiming Sender; absent until a claim succeeds
          type: string
        sessionId:
          description: Opaque session identifier the QR references
          type: string
        state:
          description: Session state; expiry is reported as expired
          enum:
          - awaiting_authorization
          - awaiting_confirmation
          - credential_ready
          - credential_issued
          - completed
          - canceled
          - expired
          - superseded
          type: string
      required:
      - sessionId
      - mode
      - receiverId
      - state
      - expiresAt
      - senderConfirmed
      - receiverConfirmed
      type: object
    PairingState:
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/PairingSessionView"
          description: Current Pairing Session view
        type:
          description: Message type; pairing_state
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - session
      type: object
    WSSError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/WSSErrorItem"
          description: Stable business error
        requestId:
          description: Correlation identifier of the operation; every recoverable failure states one
          type: string
        sessionId:
          description: Pairing Session when it is readable
          type: string
        type:
          description: Message type; error
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - requestId
      - error
      type: object
      x-error-codes:
      - code: invalid_request
        description: The received frame is not a message this direction accepts.
      - code: resource_not_found
        description: The Pairing Session does not exist or is not visible to this participant.
      - code: credential_invalid
        description: The presented credential does not authorize this Pairing Session.
      - code: credential_expired
        description: The presented credential has expired.
      - code: pairing_session_expired
        description: The Pairing Session passed its absolute lifetime.
      - code: pairing_session_closed
        description: The Pairing Session may no longer relay; it completed, was canceled or was superseded.
      - code: pairing_not_ready
        description: The session cannot relay this frame yet, for example because the other participant is not connected.
      - code: service_unavailable
        description: The service or its storage is temporarily unavailable.
      - code: internal_error
        description: An unexpected server failure occurred.
    WSSErrorItem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          description: Safe explanation; clients must not parse it
          type: string
      required:
      - code
      - detail
      type: object
  securitySchemes:
    receiverCredential:
      description: |-
        The Receiver's credential, presented on the upgrade request of its one
        delivery connection. The Receiver identity comes from the authenticated
        connection rather than from a frame.
      scheme: bearer
      type: http
    sessionCredential:
      description: |-
        The session's restricted pairing credential, or the management
        credential of the Sender that claimed the session. The service derives
        the participant side from whichever credential authenticated.
      scheme: bearer
      type: http
info:
  description: |-
    The Pin Glide v1 WebSocket surface. A client connects with the
    `pin-glide.v1` subprotocol and presents its Bearer credential on the
    upgrade request, never in a URL.
    
    Only the operations this service release implements are described here.
    Each feature ticket adds its channels, messages, shared schemas, error
    semantics and coverage together with the code that serves them.
  title: Pin Glide Service Realtime API
  version: 0.1.0
operations:
  acceptPairingHandshake:
    action: receive
    channel:
      $ref: "#/channels/pairingSessionEvents"
    messages:
    - $ref: "#/channels/pairingSessionEvents/messages/pairingRelayIn"
    security:
    - $ref: "#/components/securitySchemes/sessionCredential"
    summary: Receive one opaque handshake frame from a participant
  acceptReceiverApplicationFrame:
    action: receive
    channel:
      $ref: "#/channels/receiverEvents"
    description: |-
      The delivery and Receipt messages this channel carries arrive with live
      delivery. Until they are published, a text application frame is a
      protocol error and closes with 1002.
    messages: []
    security:
    - $ref: "#/components/securitySchemes/receiverCredential"
    summary: Accept a Receiver's application frame
  publishPairingTraffic:
    action: send
    channel:
      $ref: "#/channels/pairingSessionEvents"
    messages:
    - $ref: "#/channels/pairingSessionEvents/messages/pairingState"
    - $ref: "#/channels/pairingSessionEvents/messages/pairingRelayOut"
    - $ref: "#/channels/pairingSessionEvents/messages/credentialReady"
    - $ref: "#/channels/pairingSessionEvents/messages/error"
    security:
    - $ref: "#/components/securitySchemes/sessionCredential"
    summary: Send session state, relayed bytes and recoverable errors
  publishReceiverControl:
    action: send
    channel:
      $ref: "#/channels/receiverEvents"
    description: |-
      The service sends native Ping control frames and answers Pong. Close
      carries the meanings the channel describes; delivery and Receipt messages
      join this direction with live delivery.
    messages: []
    security:
    - $ref: "#/components/securitySchemes/receiverCredential"
    summary: Keep the delivery connection alive
servers:
  service:
    description: The deployed service origin, supplied by the installation.
    host: "{serviceHost}"
    pathname: /
    protocol: wss
    variables:
      serviceHost:
        default: localhost:8080
        description: Host and port of the public HTTPS/WSS origin.
