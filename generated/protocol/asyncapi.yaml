# Generated from protocol/asyncapi.yaml and internal/protocol; do not edit.
asyncapi: 3.1.0
channels:
  pairingSessionEvents:
    address: /v1/pairing-sessions/{id}/events
    description: "One Pairing Session's handshake channel. A participant subscribes with\nthe session's restricted credential, or with the management credential of\nthe Sender that claimed it; the service derives the participant side from\nwhichever credential authenticated. It relays opaque handshake bytes to\nthe other participant, sends the session state after subscription and on\nevery change, and reports failures without closing a usable session.\nRelayed bytes are live traffic: the service keeps no history, so a\nreconnect receives the current state and nothing sent before it.\n\nA subscription the service rejects before upgrading is an ordinary HTTP\nproblem detail: 400 invalid_request when the upgrade did not offer the\npin-glide.v1 subprotocol, 401 credential_missing, credential_invalid or\ncredential_expired, 404 resource_not_found, 410 pairing_session_expired or\npairing_session_closed, or 503 service_unavailable. A credential's own\nvalidity is decided before the protected session state, so an expired\nrestricted credential reports itself while the valid management\ncredential of the session's own Sender reports the expired session.\n\nAfter the upgrade every recoverable failure arrives as an error message\nand the connection stays open. A frame that is not a pairing_relay of this\nversion, an unknown message type and a frame for another session are\nprotocol errors rather than relay traffic, so the service closes with\n1002. Invalid text encoding closes with 1007, a session that may no longer\nrelay closes with 1008, a normal close uses 1000, server shutdown uses\n1001 and an unexpected server failure uses 1011. Close reasons carry a\nshort machine code and never secret data.\n\nOnce both authenticated reports have activated the session's Pairing, the\nchannel no longer relays: a new_receiver session tells only its Receiver\nside that the credential is ready, and a session that completes,\nsupersedes or closes ends its live connections. Redemption of the\ncredential itself is an HTTPS operation, so the restricted credential\nnever travels over this channel twice.\n\nA recover_receiver session replaces the credential of an existing\nReceiver instead of forming a Pairing. Its two authenticated reports\nstate which existing Pairing keys survived: the approving Sender reports\nwhether it still holds the key of its own association, and the Receiver\nside reports the Pairing IDs it still holds, which preserves exactly\nthose associations and removes the Receiver's other ones. An association\nthe approving Sender no longer holds a key for does not survive the\nrecovery either, and the unfinished work that Sender had with the\nReceiver closes with it. Such a session reaches credential_ready once\nboth sides have reported, creates no Pairing ID and reserves no capacity,\nand its Receiver side redeems the replacement over HTTPS exactly like a\nfirst credential.\n\nThe Pairing ID a session publishes on its first claim is the identity\nboth participants store their provisional key under, and neither selects\nit for forwarding before the session reports the activation of both\nconfirmations: credential_ready for a new Receiver, completed for an\nadded Sender. Re-pairing reserves a Pairing ID of its own next to the\nSender's current association, which keeps forwarding under its own alias\nuntil both reports commit the replacement and retire only that\nassociation. A replacement whose expected association already changed\nfails with operation_superseded and preserves the association that is\ncurrent instead.\n\nA Sender's own Account switch and an owner security revocation cancel that\nSender's unfinished reserved Pairing work in the same commit that changes\nits authority, so a channel whose claimed session was canceled closes like\nany other canceled session instead of relaying a key confirmation that\nwould activate an association its Sender no longer holds. Authority is\ndecided when a subscription is admitted, so a connection keeps the\nparticipant it authenticated until it closes, and a reconnect validates\nits credential again."
    messages:
      credentialReady:
        $ref: "#/components/messages/credentialReady"
      error:
        $ref: "#/components/messages/error"
      pairingRelayIn:
        $ref: "#/components/messages/pairingRelayIn"
      pairingRelayOut:
        $ref: "#/components/messages/pairingRelayOut"
      pairingState:
        $ref: "#/components/messages/pairingState"
    parameters:
      id:
        description: Pairing Session identifier the QR references.
    title: Restricted Pairing Session channel
    x-close-codes:
    - code: 1000
      description: The connection ended normally.
      reason: ""
    - code: 1001
      description: The service is shutting down.
      reason: service_shutdown
    - code: 1002
      description: The connection sent a frame that is not an accepted message of this protocol version, type or shape.
      reason: protocol_error
    - code: 1007
      description: The connection sent text that is not valid UTF-8.
      reason: invalid_payload
    - code: 1008
      description: The connection's credential, session or policy no longer authorizes it.
      reason: policy_violation
    - code: 1011
      description: An unexpected server failure ended the connection.
      reason: internal_error
  receiverEvents:
    address: /v1/receiver/events
    description: "The single long-lived delivery channel of one Receiver, authenticated by\nits Receiver credential on the upgrade request. An upgrade must offer the\npin-glide.v1 subprotocol, and one that does not is rejected before the\nupgrade with HTTP 400 invalid_request. One Receiver generation has one\nreserved or active slot: a second handshake with the same credential is\nrejected before the upgrade with HTTP 409 receiver_already_connected and\nnever evicts the connection that already holds the slot. A rejected\nhandshake leaves that connection's presence unchanged.\n\nThis connection is the Receiver's liveness. Online begins with the\ncommitted upgrade, and the owning Sender's Receiver list reports the\nReceiver offline on the end of that connection, on a heartbeat failure or\non a service restart. The service sends a Ping every 15 seconds and\nrequires the Pong within 5 seconds, then closes and releases a connection\nthat stopped answering, so a half-open transport cannot hold the slot. A\nreconnect is a new live connection and receives nothing kept for the\nprevious one.\n\nThis is also the delivery channel. The service writes one delivery\nmessage per admitted Delivery of one Sender's Message, carrying that\nSender's ciphertext for this Receiver unchanged; the Sender supplies one\nindependent ciphertext per Receiver it selected, so the service never\nselects a target or re-encrypts content. The Receiver answers with a\nreceipt once it can read the Sender and Message correlation, before it\nvalidates, decrypts or displays anything: a Receipt means arrival only.\nThe service correlates a Receipt by the authenticated connection, the\nSender and the Message, accepts it only for that Receiver's registered\nin-flight work, and ignores a duplicate or late Receipt without changing\na terminal result. A frame that is not a receipt of this version, and\ntherefore carries no usable correlation, is a protocol error and closes\nwith 1002 rather than being answered with a fabricated Receipt. Delivery\nis live-only: the service keeps no backlog for a Receiver that is not\nconnected, never replays ciphertext on reconnect, and never retries an\nuncertain delivery.\n\nA successful upgrade commits credential possession: the session whose\ngrant the credential came from completes and its restricted pairing\nchannel closes. Invalid text encoding closes with 1007, a normal close\nuses 1000, server shutdown uses 1001 and an unexpected server failure uses\n1011.\n\nThe service also reports association changes here: a Sender that removes\nits own association is announced as pairing_removed, which withdraws that\nSender's forwarding authority for the named Pairing while the Receiver's\ncredential, its connection and every other Sender's association keep\nworking. A Sender's Account switch and its owner security revocation\nannounce pairing_removed for every association that Sender still held and\nleave the Receiver's credential, its connection and every other Sender's\nassociation untouched.\n\nA credential generation the service replaced loses this connection: the\nreplacement of an owner-approved recovery revokes the credential it\nsupersedes and ends its reserved and active connections with 1008\npolicy_violation before the replacement is handed out, so the Receiver\nconnects again with the credential it saved and never shares the\nconnection of the credential that stopped authorizing.\n\nAn Account owner's security revocation of this Receiver closes its\nregistration, invalidates its credential, cancels its unfinished\nissuance and recovery grants and removes every Pairing that forwards to\nit, all in one commit. Its committed connection receives device_revoked\nand then closes with 1008 policy_violation, a handshake that is still\ncommitting is refused before its 101, and a later handshake with the\nrevoked credential is refused with HTTP 401 credential_invalid because a\nclosed registration authorizes nothing. The control is best effort: a\nconnection that can no longer carry it does not delay the closure. Other\nReceivers keep their registration, their credential, their Pairings and\ntheir connection, including a Receiver the same Account owns."
    messages:
      delivery:
        $ref: "#/components/messages/delivery"
      deviceRevoked:
        $ref: "#/components/messages/deviceRevoked"
      pairingRemoved:
        $ref: "#/components/messages/pairingRemoved"
      receipt:
        $ref: "#/components/messages/receipt"
    title: Receiver delivery channel
    x-close-codes:
    - code: 1000
      description: The connection ended normally.
      reason: ""
    - code: 1001
      description: The service is shutting down.
      reason: service_shutdown
    - code: 1002
      description: The connection sent a frame that is not an accepted message of this protocol version, type or shape.
      reason: protocol_error
    - code: 1007
      description: The connection sent text that is not valid UTF-8.
      reason: invalid_payload
    - code: 1008
      description: The connection's credential, session or policy no longer authorizes it.
      reason: policy_violation
    - code: 1011
      description: An unexpected server failure ended the connection.
      reason: internal_error
components:
  messages:
    credentialReady:
      description: "Sent only to the Receiver side of a session that issues a credential,\nonce a new_receiver session activated its Pairing or a recover_receiver\nsession received both of its authenticated key reports. It carries no\ncredential: the Receiver redeems its credential over HTTPS with the\nrestricted credential it already holds, and the Sender side never\nlearns that the credential exists."
      name: credential_ready
      payload:
        $ref: "#/components/schemas/CredentialReady"
      title: The session's Receiver credential can be redeemed
    delivery:
      description: "Sent to the current committed delivery connection of the Receiver one\nadmitted Delivery selected. The payload is the Sender's ciphertext,\nnonce and crypto profile unchanged, together with the correlation the\nReceiver reports back in its Receipt. The service keeps no copy: the\nciphertext exists only for this attempt, and a duplicate upload of the\nsame Sender, Message and Receiver never sends it twice."
      name: delivery
      payload:
        $ref: "#/components/schemas/Delivery"
      title: One Message ciphertext for this Receiver
    deviceRevoked:
      description: "Sent to the delivery connection of the Receiver whose registration the\nAccount owner security revocation permanently closed. The Receiver\nstops using its credential: it no longer authorizes delivery or pairing\nand every Pairing that forwarded to it is removed for every Sender.\nThe connection ends with 1008 policy_violation after this message, so a\nReceiver that reconnects is refused instead. Sending it is best effort:\na connection that can no longer carry it does not delay or prevent the\nclosure the revocation already committed."
      name: device_revoked
      payload:
        $ref: "#/components/schemas/DeviceRevoked"
      title: Owner security revocation closed this Receiver
    error:
      description: |-
        A failure that leaves the session usable, so the connection stays open.
        pairing_not_ready means the session cannot relay this frame yet, for
        example because the other participant is not connected; the client
        retries once its peer is present.
      name: error
      payload:
        $ref: "#/components/schemas/WSSError"
      title: Recoverable application error
    pairingRelayIn:
      name: pairing_relay
      payload:
        $ref: "#/components/schemas/PairingRelayIn"
      title: Opaque handshake frame from a participant
    pairingRelayOut:
      description: The payload is unchanged; the side is derived from authentication.
      name: pairing_relay
      payload:
        $ref: "#/components/schemas/PairingRelayOut"
      title: The peer's opaque handshake frame
    pairingRemoved:
      description: |-
        Sent to the delivery connection of the Receiver whose Sender removed
        one of its own associations. The Receiver stops expecting deliveries
        for that Pairing; it keeps its credential and its connection, and every
        other Sender's association keeps forwarding.
      name: pairing_removed
      payload:
        $ref: "#/components/schemas/PairingRemoved"
      title: A Sender removed its association with this Receiver
    pairingState:
      description: The session state after an authorized subscription and after every change.
      name: pairing_state
      payload:
        $ref: "#/components/schemas/PairingState"
      title: Pairing Session state
    receipt:
      description: |-
        The Receiver's acknowledgement that a Message arrived, sent once it can
        read the Sender and Message correlation and before it validates,
        decrypts or displays anything. The Receiver identity comes from the
        authenticated connection, so a Receipt never names another Receiver's
        Delivery. The service accepts it only for that Receiver's registered
        in-flight work and ignores a duplicate or late Receipt, so no Receipt
        changes a terminal result.
      name: receipt
      payload:
        $ref: "#/components/schemas/Receipt"
      title: The Receiver reports arrival of one Message
  schemas:
    BusinessError:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code
          type: string
        detail:
          description: Safe explanation; clients must not parse it
          type: string
        errors:
          description: Validation locations when the failure was a shape or field failure
          items:
            $ref: "#/components/schemas/ErrorItem"
          type:
          - array
          - "null"
      required:
      - code
      - detail
      type: object
    CredentialReady:
      additionalProperties: false
      properties:
        expiresAt:
          description: Absolute end of the restricted credential's redemption window
          format: date-time
          type: string
        receiverId:
          description: Receiver the credential belongs to
          type: string
        sessionId:
          description: Pairing Session whose credential is ready
          type: string
        type:
          description: Message type; credential_ready
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - sessionId
      - receiverId
      - expiresAt
      type: object
    Delivery:
      additionalProperties: false
      properties:
        ciphertext:
          description: Padded-Base64 ciphertext followed by its authentication tag
          type: string
        cryptoVersion:
          description: Encryption profile version of the ciphertext
          format: int64
          type: integer
        messageId:
          description: Message ID of the Sender's SMS operation
          type: string
        nonce:
          description: Padded-Base64 96-bit nonce the Sender generated for this ciphertext
          type: string
        pairingId:
          description: Pairing that authorized this delivery
          type: string
        receiverId:
          description: Receiver this delivery is addressed to
          type: string
        senderId:
          description: Sender this Message came from
          type: string
        type:
          description: Message type; delivery
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - senderId
      - receiverId
      - pairingId
      - messageId
      - cryptoVersion
      - nonce
      - ciphertext
      type: object
    DeviceRevoked:
      additionalProperties: false
      properties:
        receiverId:
          description: Receiver whose registration security revocation closed
          type: string
        type:
          description: Message type; device_revoked
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
