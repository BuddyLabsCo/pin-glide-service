      - mode
      - receiverId
      - state
      - expiresAt
      - senderConfirmed
      - receiverConfirmed
      type: object
    PairingState:
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/PairingSessionView"
          description: Current Pairing Session view
        type:
          description: Message type; pairing_state
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - session
      type: object
    Receipt:
      additionalProperties: false
      properties:
        messageId:
          description: Message ID the Receiver acknowledges arrival of
          type: string
        senderId:
          description: Sender the acknowledged Message came from
          type: string
        type:
          description: Message type; receipt
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - senderId
      - messageId
      type: object
    WSSError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/BusinessError"
          description: Stable business error
        requestId:
          description: Correlation identifier of the operation; every recoverable failure states one
          type: string
        sessionId:
          description: Pairing Session when it is readable
          type: string
        type:
          description: Message type; error
          type: string
        version:
          description: Application message version; always 1
          format: int64
          type: integer
      required:
      - version
      - type
      - requestId
      - error
      type: object
      x-error-codes:
      - code: invalid_request
        description: The received frame is not a message this direction accepts.
      - code: resource_not_found
        description: The Pairing Session does not exist or is not visible to this participant.
      - code: credential_invalid
        description: The presented credential does not authorize this Pairing Session.
      - code: credential_expired
        description: The presented credential has expired.
      - code: pairing_session_expired
        description: The Pairing Session passed its absolute lifetime.
      - code: pairing_session_closed
        description: The Pairing Session may no longer relay; it completed, was canceled or was superseded.
      - code: pairing_not_ready
        description: The session cannot relay this frame yet, for example because the other participant is not connected.
      - code: service_unavailable
        description: The service or its storage is temporarily unavailable.
      - code: internal_error
        description: An unexpected server failure occurred.
  securitySchemes:
    receiverCredential:
      description: |-
        The Receiver's credential, presented on the upgrade request of its one
        delivery connection. The Receiver identity comes from the authenticated
        connection rather than from a frame.
      scheme: bearer
      type: http
    sessionCredential:
      description: |-
        The session's restricted pairing credential, or the management
        credential of the Sender that claimed the session. The service derives
        the participant side from whichever credential authenticated.
      scheme: bearer
      type: http
info:
  description: |-
    The Pin Glide v1 WebSocket surface. A client connects with the
    `pin-glide.v1` subprotocol and presents its Bearer credential on the
    upgrade request, never in a URL.
    
    Only the operations this service release implements are described here.
    Each feature ticket adds its channels, messages, shared schemas, error
    semantics and coverage together with the code that serves them.
  title: Pin Glide Service Realtime API
  version: 0.1.0
operations:
  acceptPairingHandshake:
    action: receive
    channel:
      $ref: "#/channels/pairingSessionEvents"
    messages:
    - $ref: "#/channels/pairingSessionEvents/messages/pairingRelayIn"
    security:
    - $ref: "#/components/securitySchemes/sessionCredential"
    summary: Receive one opaque handshake frame from a participant
  acceptReceiverApplicationFrame:
    action: receive
    channel:
      $ref: "#/channels/receiverEvents"
    description: |-
      The only application frame this direction accepts is this version's
      receipt, and its Receiver comes from the authenticated connection rather
      than from the payload. A text frame that is not one, including one whose
      Sender or Message correlation is unreadable, is a protocol error and
      closes with 1002; the service never acknowledges arrival it cannot
      correlate.
    messages:
    - $ref: "#/channels/receiverEvents/messages/receipt"
    security:
    - $ref: "#/components/securitySchemes/receiverCredential"
    summary: Accept a Receiver's application frame
  publishPairingTraffic:
    action: send
    channel:
      $ref: "#/channels/pairingSessionEvents"
    messages:
    - $ref: "#/channels/pairingSessionEvents/messages/pairingState"
    - $ref: "#/channels/pairingSessionEvents/messages/pairingRelayOut"
    - $ref: "#/channels/pairingSessionEvents/messages/credentialReady"
    - $ref: "#/channels/pairingSessionEvents/messages/error"
    security:
    - $ref: "#/components/securitySchemes/sessionCredential"
    summary: Send session state, relayed bytes and recoverable errors
  publishReceiverControl:
    action: send
    channel:
      $ref: "#/channels/receiverEvents"
    description: "The service sends native Ping control frames and answers Pong. Close\ncarries the meanings the channel describes.\n\nA delivery message is one admitted Delivery of one Sender's Message for\nthis Receiver, carrying the Sender's ciphertext unchanged with the\nPairing that authorized it and the crypto profile that describes it. The\nservice sends it only while this connection is the Receiver's current\ncommitted delivery connection, within the adopted two-second write bound,\nand expects the matching receipt within the five-second bound after a\nsuccessful write: a Receiver that does not answer within that bound is\nreported to the Sender as ack_timeout, which does not prove that nothing\narrived. A write that failed is reported as send_failed, and a Receiver\nwhose connection is gone is reported as offline for that invocation.\n\nA Sender that removes its own association is reported here as\npairing_removed, so a connected Receiver stops treating that Pairing as\none that may deliver without polling. The message states the Sender and\nthe removed Pairing only: the Receiver's credential, this connection and\nevery other Sender's association are unaffected, and the service keeps no\nbacklog for a Receiver that is not connected.\n\nAn Account owner's security revocation of the connected Receiver is\nreported here as device_revoked, which states the Receiver whose\nregistration closed, and the connection ends with 1008\npolicy_violation after it. The message is the only notice the connection\ngets, so a Receiver that misses it learns the same outcome from the\nrefusal of its next handshake."
    messages:
    - $ref: "#/channels/receiverEvents/messages/delivery"
    - $ref: "#/channels/receiverEvents/messages/pairingRemoved"
    - $ref: "#/channels/receiverEvents/messages/deviceRevoked"
    security:
    - $ref: "#/components/securitySchemes/receiverCredential"
    summary: Keep the delivery connection alive and report what ended its access
servers:
  service:
    description: The deployed service origin, supplied by the installation.
    host: "{serviceHost}"
    pathname: /
    protocol: wss
    variables:
      serviceHost:
        default: localhost:8080
        description: Host and port of the public HTTPS/WSS origin.
