name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; defaults to the event checkout.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: binary

      - name: Check formatting
        run: make format-check

      - name: Run static checks
        run: make lint

      - name: Run SQL checks
        run: make lint-sql

      - name: Check published contracts
        run: make check-contracts

  generated:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate artifacts
        run: make generate

      - name: Fail on generated drift
        run: ./scripts/quality/check-generated.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: make test

  build:
    name: Build and upload evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p build-evidence
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            go version
            make build
          } 2>&1 | tee build-evidence/build.log

      - name: Record build checksums
        run: sha256sum build-evidence/build.log > build-evidence/SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@v5
        with:
          name: pin-glide-service-build-evidence-${{ inputs.ref || github.sha }}
          path: build-evidence
          if-no-files-found: error
          retention-days: 14
