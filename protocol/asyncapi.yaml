# Handwritten WSS definitions. `make generate` assembles them with the shared
# wire schemas from internal/protocol into generated/protocol/asyncapi.yaml, so
# edit this file rather than the generated description.
asyncapi: 3.1.0

info:
  title: Pin Glide Service Realtime API
  version: 0.1.0
  description: |-
    The Pin Glide v1 WebSocket surface. A client connects with the
    `pin-glide.v1` subprotocol and presents its Bearer credential on the
    upgrade request, never in a URL.

    Only the operations this service release implements are described here.
    Each feature ticket adds its channels, messages, shared schemas, error
    semantics and coverage together with the code that serves them.

servers:
  service:
    host: '{serviceHost}'
    protocol: wss
    pathname: /
    description: The deployed service origin, supplied by the installation.
    variables:
      serviceHost:
        default: localhost:8080
        description: Host and port of the public HTTPS/WSS origin.

channels:
  pairingSessionEvents:
    address: /v1/pairing-sessions/{id}/events
    title: Restricted Pairing Session channel
    description: |-
      One Pairing Session's handshake channel. A participant subscribes with
      the session's restricted credential, or with the management credential of
      the Sender that claimed it; the service derives the participant side from
      whichever credential authenticated. It relays opaque handshake bytes to
      the other participant, sends the session state after subscription and on
      every change, and reports failures without closing a usable session.
      Relayed bytes are live traffic: the service keeps no history, so a
      reconnect receives the current state and nothing sent before it.

      A subscription the service rejects before upgrading is an ordinary HTTP
      problem detail: 400 invalid_request when the upgrade did not offer the
      pin-glide.v1 subprotocol, 401 credential_missing, credential_invalid or
      credential_expired, 404 resource_not_found, 410 pairing_session_expired or
      pairing_session_closed, or 503 service_unavailable. A credential's own
      validity is decided before the protected session state, so an expired
      restricted credential reports itself while the valid management
      credential of the session's own Sender reports the expired session.

      After the upgrade every recoverable failure arrives as an error message
      and the connection stays open. A frame that is not a pairing_relay of this
      version, an unknown message type and a frame for another session are
      protocol errors rather than relay traffic, so the service closes with
      1002. Invalid text encoding closes with 1007, a session that may no longer
      relay closes with 1008, a normal close uses 1000, server shutdown uses
      1001 and an unexpected server failure uses 1011. Close reasons carry a
      short machine code and never secret data.

      Once both authenticated reports have activated the session's Pairing, the
      channel no longer relays: a new_receiver session tells only its Receiver
      side that the credential is ready, and a session that completes,
      supersedes or closes ends its live connections. Redemption of the
      credential itself is an HTTPS operation, so the restricted credential
      never travels over this channel twice.

      A recover_receiver session replaces the credential of an existing
      Receiver instead of forming a Pairing. Its two authenticated reports
      state which existing Pairing keys survived: the approving Sender reports
      whether it still holds the key of its own association, and the Receiver
      side reports the Pairing IDs it still holds, which preserves exactly
      those associations and removes the Receiver's other ones. An association
      the approving Sender no longer holds a key for does not survive the
      recovery either, and the unfinished work that Sender had with the
      Receiver closes with it. Such a session reaches credential_ready once
      both sides have reported, creates no Pairing ID and reserves no capacity,
      and its Receiver side redeems the replacement over HTTPS exactly like a
      first credential.

      The Pairing ID a session publishes on its first claim is the identity
      both participants store their provisional key under, and neither selects
      it for forwarding before the session reports the activation of both
      confirmations: credential_ready for a new Receiver, completed for an
      added Sender. Re-pairing reserves a Pairing ID of its own next to the
      Sender's current association, which keeps forwarding under its own alias
      until both reports commit the replacement and retire only that
      association. A replacement whose expected association already changed
      fails with operation_superseded and preserves the association that is
      current instead.

      A Sender's own Account switch and an owner security revocation cancel that
      Sender's unfinished reserved Pairing work in the same commit that changes
      its authority, so a channel whose claimed session was canceled closes like
      any other canceled session instead of relaying a key confirmation that
      would activate an association its Sender no longer holds. Authority is
      decided when a subscription is admitted, so a connection keeps the
      participant it authenticated until it closes, and a reconnect validates
      its credential again.
    parameters:
      id:
        description: Pairing Session identifier the QR references.
    messages:
      pairingState:
        $ref: '#/components/messages/pairingState'
      pairingRelayIn:
        $ref: '#/components/messages/pairingRelayIn'
      pairingRelayOut:
        $ref: '#/components/messages/pairingRelayOut'
      credentialReady:
        $ref: '#/components/messages/credentialReady'
      error:
        $ref: '#/components/messages/error'

  receiverEvents:
    address: /v1/receiver/events
    title: Receiver delivery channel
    description: |-
      The single long-lived delivery channel of one Receiver, authenticated by
      its Receiver credential on the upgrade request. An upgrade must offer the
      pin-glide.v1 subprotocol, and one that does not is rejected before the
      upgrade with HTTP 400 invalid_request. One Receiver generation has one
      reserved or active slot: a second handshake with the same credential is
      rejected before the upgrade with HTTP 409 receiver_already_connected and
      never evicts the connection that already holds the slot. A rejected
      handshake leaves that connection's presence unchanged.

      This connection is the Receiver's liveness. Online begins with the
      committed upgrade, and the owning Sender's Receiver list reports the
      Receiver offline on the end of that connection, on a heartbeat failure or
      on a service restart. The service sends a Ping every 15 seconds and
      requires the Pong within 5 seconds, then closes and releases a connection
      that stopped answering, so a half-open transport cannot hold the slot. A
      reconnect is a new live connection and receives nothing kept for the
      previous one.

      This is also the delivery channel. The service writes one delivery
      message per admitted Delivery of one Sender's Message, carrying that
      Sender's ciphertext for this Receiver unchanged; the Sender supplies one
      independent ciphertext per Receiver it selected, so the service never
      selects a target or re-encrypts content. The Receiver answers with a
      receipt once it can read the Sender and Message correlation, before it
      validates, decrypts or displays anything: a Receipt means arrival only.
      The service correlates a Receipt by the authenticated connection, the
      Sender and the Message, accepts it only for that Receiver's registered
      in-flight work, and ignores a duplicate or late Receipt without changing
      a terminal result. A frame that is not a receipt of this version, and
      therefore carries no usable correlation, is a protocol error and closes
      with 1002 rather than being answered with a fabricated Receipt. Delivery
      is live-only: the service keeps no backlog for a Receiver that is not
      connected, never replays ciphertext on reconnect, and never retries an
      uncertain delivery.

      A successful upgrade commits credential possession: the session whose
      grant the credential came from completes and its restricted pairing
      channel closes. Invalid text encoding closes with 1007, a normal close
      uses 1000, server shutdown uses 1001 and an unexpected server failure uses
      1011.

      The service also reports association changes here: a Sender that removes
      its own association is announced as pairing_removed, which withdraws that
      Sender's forwarding authority for the named Pairing while the Receiver's
      credential, its connection and every other Sender's association keep
      working. A Sender's Account switch and its owner security revocation
      announce pairing_removed for every association that Sender still held and
      leave the Receiver's credential, its connection and every other Sender's
      association untouched.

      A credential generation the service replaced loses this connection: the
      replacement of an owner-approved recovery revokes the credential it
      supersedes and ends its reserved and active connections with 1008
      policy_violation before the replacement is handed out, so the Receiver
      connects again with the credential it saved and never shares the
      connection of the credential that stopped authorizing.

      An Account owner's security revocation of this Receiver closes its
      registration, invalidates its credential, cancels its unfinished
      issuance and recovery grants and removes every Pairing that forwards to
      it, all in one commit. Its committed connection receives device_revoked
      and then closes with 1008 policy_violation, a handshake that is still
      committing is refused before its 101, and a later handshake with the
      revoked credential is refused with HTTP 401 credential_invalid because a
      closed registration authorizes nothing. The control is best effort: a
      connection that can no longer carry it does not delay the closure. Other
      Receivers keep their registration, their credential, their Pairings and
      their connection, including a Receiver the same Account owns.
    messages:
      delivery:
        $ref: '#/components/messages/delivery'
      receipt:
        $ref: '#/components/messages/receipt'
      pairingRemoved:
        $ref: '#/components/messages/pairingRemoved'
      deviceRevoked:
        $ref: '#/components/messages/deviceRevoked'

operations:
  acceptPairingHandshake:
    action: receive
    channel:
      $ref: '#/channels/pairingSessionEvents'
    summary: Receive one opaque handshake frame from a participant
    security:
      - $ref: '#/components/securitySchemes/sessionCredential'
    messages:
      - $ref: '#/channels/pairingSessionEvents/messages/pairingRelayIn'
  publishPairingTraffic:
    action: send
    channel:
      $ref: '#/channels/pairingSessionEvents'
    summary: Send session state, relayed bytes and recoverable errors
    security:
      - $ref: '#/components/securitySchemes/sessionCredential'
    messages:
      - $ref: '#/channels/pairingSessionEvents/messages/pairingState'
      - $ref: '#/channels/pairingSessionEvents/messages/pairingRelayOut'
      - $ref: '#/channels/pairingSessionEvents/messages/credentialReady'
      - $ref: '#/channels/pairingSessionEvents/messages/error'

  acceptReceiverApplicationFrame:
    action: receive
    channel:
      $ref: '#/channels/receiverEvents'
    summary: Accept a Receiver's application frame
    description: |-
      The only application frame this direction accepts is this version's
      receipt, and its Receiver comes from the authenticated connection rather
      than from the payload. A text frame that is not one, including one whose
      Sender or Message correlation is unreadable, is a protocol error and
      closes with 1002; the service never acknowledges arrival it cannot
      correlate.
    security:
      - $ref: '#/components/securitySchemes/receiverCredential'
    messages:
      - $ref: '#/channels/receiverEvents/messages/receipt'
  publishReceiverControl:
    action: send
    channel:
      $ref: '#/channels/receiverEvents'
    summary: Keep the delivery connection alive and report what ended its access
    description: |-
      The service sends native Ping control frames and answers Pong. Close
      carries the meanings the channel describes.

      A delivery message is one admitted Delivery of one Sender's Message for
      this Receiver, carrying the Sender's ciphertext unchanged with the
      Pairing that authorized it and the crypto profile that describes it. The
      service sends it only while this connection is the Receiver's current
      committed delivery connection, within the adopted two-second write bound,
      and expects the matching receipt within the five-second bound after a
      successful write: a Receiver that does not answer within that bound is
      reported to the Sender as ack_timeout, which does not prove that nothing
      arrived. A write that failed is reported as send_failed, and a Receiver
      whose connection is gone is reported as offline for that invocation.

      A Sender that removes its own association is reported here as
      pairing_removed, so a connected Receiver stops treating that Pairing as
      one that may deliver without polling. The message states the Sender and
      the removed Pairing only: the Receiver's credential, this connection and
      every other Sender's association are unaffected, and the service keeps no
      backlog for a Receiver that is not connected.

      An Account owner's security revocation of the connected Receiver is
      reported here as device_revoked, which states the Receiver whose
      registration closed, and the connection ends with 1008
      policy_violation after it. The message is the only notice the connection
      gets, so a Receiver that misses it learns the same outcome from the
      refusal of its next handshake.
    security:
      - $ref: '#/components/securitySchemes/receiverCredential'
    messages:
      - $ref: '#/channels/receiverEvents/messages/delivery'
      - $ref: '#/channels/receiverEvents/messages/pairingRemoved'
      - $ref: '#/channels/receiverEvents/messages/deviceRevoked'

components:
  securitySchemes:
    sessionCredential:
      type: http
      scheme: bearer
      description: |-
        The session's restricted pairing credential, or the management
        credential of the Sender that claimed the session. The service derives
        the participant side from whichever credential authenticated.
    receiverCredential:
      type: http
      scheme: bearer
      description: |-
        The Receiver's credential, presented on the upgrade request of its one
        delivery connection. The Receiver identity comes from the authenticated
        connection rather than from a frame.
  messages:
    delivery:
      name: delivery
      title: One Message ciphertext for this Receiver
      description: |-
        Sent to the current committed delivery connection of the Receiver one
        admitted Delivery selected. The payload is the Sender's ciphertext,
        nonce and crypto profile unchanged, together with the correlation the
        Receiver reports back in its Receipt. The service keeps no copy: the
        ciphertext exists only for this attempt, and a duplicate upload of the
        same Sender, Message and Receiver never sends it twice.
      payload:
        $ref: '#/components/schemas/Delivery'
    receipt:
      name: receipt
      title: The Receiver reports arrival of one Message
      description: |-
        The Receiver's acknowledgement that a Message arrived, sent once it can
        read the Sender and Message correlation and before it validates,
        decrypts or displays anything. The Receiver identity comes from the
        authenticated connection, so a Receipt never names another Receiver's
        Delivery. The service accepts it only for that Receiver's registered
        in-flight work and ignores a duplicate or late Receipt, so no Receipt
        changes a terminal result.
      payload:
        $ref: '#/components/schemas/Receipt'
    pairingState:
      name: pairing_state
      title: Pairing Session state
      description: The session state after an authorized subscription and after every change.
      payload:
        $ref: '#/components/schemas/PairingState'
    pairingRelayIn:
      name: pairing_relay
      title: Opaque handshake frame from a participant
      payload:
        $ref: '#/components/schemas/PairingRelayIn'
    pairingRelayOut:
      name: pairing_relay
      title: The peer's opaque handshake frame
      description: The payload is unchanged; the side is derived from authentication.
      payload:
        $ref: '#/components/schemas/PairingRelayOut'
    credentialReady:
      name: credential_ready
      title: The session's Receiver credential can be redeemed
      description: |-
        Sent only to the Receiver side of a session that issues a credential,
        once a new_receiver session activated its Pairing or a recover_receiver
        session received both of its authenticated key reports. It carries no
        credential: the Receiver redeems its credential over HTTPS with the
        restricted credential it already holds, and the Sender side never
        learns that the credential exists.
      payload:
        $ref: '#/components/schemas/CredentialReady'
    pairingRemoved:
      name: pairing_removed
      title: A Sender removed its association with this Receiver
      description: |-
        Sent to the delivery connection of the Receiver whose Sender removed
        one of its own associations. The Receiver stops expecting deliveries
        for that Pairing; it keeps its credential and its connection, and every
        other Sender's association keeps forwarding.
      payload:
        $ref: '#/components/schemas/PairingRemoved'
    deviceRevoked:
      name: device_revoked
      title: Owner security revocation closed this Receiver
      description: |-
        Sent to the delivery connection of the Receiver whose registration the
        Account owner security revocation permanently closed. The Receiver
        stops using its credential: it no longer authorizes delivery or pairing
        and every Pairing that forwarded to it is removed for every Sender.
        The connection ends with 1008 policy_violation after this message, so a
        Receiver that reconnects is refused instead. Sending it is best effort:
        a connection that can no longer carry it does not delay or prevent the
        closure the revocation already committed.
      payload:
        $ref: '#/components/schemas/DeviceRevoked'
    error:
      name: error
      title: Recoverable application error
      description: |-
        A failure that leaves the session usable, so the connection stays open.
        pairing_not_ready means the session cannot relay this frame yet, for
        example because the other participant is not connected; the client
        retries once its peer is present.
      payload:
        $ref: '#/components/schemas/WSSError'
